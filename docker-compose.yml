services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: grisomaq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque_esta_senha}
      POSTGRES_DB: grisomaq
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "grisomaq"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Opcional: exponha a porta só se quiser conectar de fora do docker
    # ports:
    #   - "5432:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Runtime da app. Se definir APP_DB_PASSWORD abaixo, o entrypoint cria a
      # role limitada `grisomaq_app` e você pode trocar esta URL pra usá-la —
      # segunda camada de proteção sobre a trigger imutável do audit_log.
      POSTGRES_URL: postgres://grisomaq:${POSTGRES_PASSWORD:-troque_esta_senha}@db:5432/grisomaq
      # Opcional: URL de owner usada só pelos scripts db/*.ts (migrations, seeds).
      # Se omitida, fallback para POSTGRES_URL — mantém o comportamento atual.
      # POSTGRES_URL_ADMIN: postgres://grisomaq:${POSTGRES_PASSWORD}@db:5432/grisomaq
      # Opcional: se definida (min 8 chars), o apply-constraints cria a role
      # `grisomaq_app` no primeiro boot. Você então aponta POSTGRES_URL acima
      # pra ela: postgres://grisomaq_app:$APP_DB_PASSWORD@db:5432/grisomaq
      # APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
      AUTH_SECRET: ${AUTH_SECRET:?defina AUTH_SECRET no .env}
      ADMIN_SENHA: ${ADMIN_SENHA:-grisomaq123}
      # Roda drizzle push + seed no primeiro start; troque para 0 depois
      SEED_ADMIN: ${SEED_ADMIN:-1}
      UPLOAD_DIR: /data/uploads
      NEXT_PUBLIC_UPLOAD_BASE_URL: /api/uploads
    volumes:
      - uploads:/data
    ports:
      - "3000:3000"

volumes:
  pgdata:
  uploads:
